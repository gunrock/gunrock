# PyGunrock Python Interface Workflow
name: PyGunrock

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - backend: nvidia
            container: nvcr.io/nvidia/pytorch:26.09-py3@sha256:f71fd67f6d71f685e0bd08ce6c8df48807624cc5d48886370d3471bc4f89d81d
            architectures: "90"
            cmake_arch_flag: "-DCMAKE_CUDA_ARCHITECTURES=90"
            cmake_prefix_path: "/usr/local/cuda"
          - backend: amd
            container: rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
            architectures: "gfx950"
            cmake_arch_flag: "-DCMAKE_HIP_ARCHITECTURES=gfx950"
            cmake_prefix_path: "/opt/rocm"
        
    # https://github.blog/changelog/2021-02-08-github-actions-skip-pull-request-and-push-workflows-with-skip-ci/
    if: "!contains(github.event.commits[0].message, '[skip pygunrock]')"
    runs-on: ubuntu-latest
    name: Build PyGunrock (${{matrix.backend}})

    steps:
      # Free up disk space before pulling large Docker images
      # ROCm PyTorch images are ~12GB, NVIDIA PyTorch images are ~8-10GB
      # Standard GitHub runners have ~14GB free, which is not enough
      - name: Free up disk space
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          tools-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check available disk space (before)
        run: df -h

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      # Pull the Docker image
      - name: Pull Docker image
        run: docker pull ${{matrix.container}}

      - name: Check available disk space (after pull)
        run: df -h

      # Verify backend installation
      - name: Check CUDA/HIP version in container
        run: |
          docker run --rm \
            ${{matrix.container}} \
            bash -c "
              if [ '${{matrix.backend}}' = 'nvidia' ]; then
                nvcc --version
              else
                hipcc --version
              fi
            "

      # Verify PyTorch installation
      - name: Verify PyTorch installation in container
        run: |
          docker run --rm \
            ${{matrix.container}} \
            bash -c "
              python3 -c 'import torch; print(f\"PyTorch version: {torch.__version__}\")'
              python3 -c 'import torch; print(f\"CUDA/ROCm available: {torch.cuda.is_available()}\")'
            "

      # Install dependencies, build, and verify PyGunrock
      - name: Install dependencies, build, and verify PyGunrock in container
        run: |
          docker run --rm \
            -v ${{github.workspace}}:/workspace \
            -w /workspace/python \
            ${{matrix.container}} \
            bash -c "
              set -e
              python3 -m pip install --break-system-packages cmake==4.4.4 nanobind==3.1.0 scikit-build-core==1.1.1
              NANOBIND_CMAKE=\$(python3 -c 'import nanobind; print(nanobind.cmake_dir())')
              CMAKE_PREFIX_PATH='${{matrix.cmake_prefix_path}}'
              if [ '${{matrix.backend}}' = 'amd' ]; then
                CMAKE_PREFIX_PATH=\$(hipconfig --path)
              fi
              echo \"nanobind CMake directory: \$NANOBIND_CMAKE\"
              CMAKE_ARGS='${{matrix.cmake_arch_flag}} -DCMAKE_PREFIX_PATH='\$CMAKE_PREFIX_PATH' -Dnanobind_DIR='\$NANOBIND_CMAKE python3 -m pip install --break-system-packages --no-build-isolation -e . -v
              echo \"=== Verifying PyGunrock installation ===\"
              python3 -c 'import gunrock; print(f\"PyGunrock version: {gunrock.__version__}\")'
            "
