# Functional AMD GPU tests on a CPU-only runner. See tests/rocjitsu/README.md.
name: rocjitsu tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rocjitsu.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "docker/rocjitsu/**"
      - "include/**"
      - "tests/data/**"
      - "tests/rocjitsu/**"
      - "tests/unit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rocjitsu.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "docker/rocjitsu/**"
      - "include/**"
      - "tests/data/**"
      - "tests/rocjitsu/**"
      - "tests/unit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocjitsu-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: gfx950 coverage and architecture compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: gunrock-rocjitsu

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk for the emulator image
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Build rocjitsu image
        run: docker build --pull -t "$IMAGE" docker/rocjitsu

      - name: Run tests and enforce host coverage
        run: |
          mkdir -p results/rocjitsu
          timeout --signal=TERM 30m \
            docker run --rm --init --shm-size 4g \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/home \
              -e RJ_THREADS=2 \
              -e RJ_BUILD_JOBS=2 \
              -v "$PWD:/work" \
              -w /work \
              "$IMAGE" \
              tests/rocjitsu/run-tests.sh results/rocjitsu \
            2>&1 | tee results/rocjitsu/ci.log
          status=${PIPESTATUS[0]}
          [[ $status -eq 0 ]] || exit "$status"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocjitsu-results
          path: results/rocjitsu/
          retention-days: 14
