# Gunrock/Essentials Ubuntu Workflow
name: Ubuntu

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master and dev branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        backend: [nvidia, amd, amd-sparse]
        include:
          - backend: nvidia
            architectures: "90"
            cmake_backend_flag: "-DESSENTIALS_NVIDIA_BACKEND=ON -DESSENTIALS_AMD_BACKEND=OFF"
            cmake_arch_flag: "-DCMAKE_CUDA_ARCHITECTURES=90"
          - backend: amd
            architectures: "gfx950"
            cmake_backend_flag: "-DESSENTIALS_AMD_BACKEND=ON -DESSENTIALS_NVIDIA_BACKEND=OFF"
            cmake_arch_flag: "-DCMAKE_HIP_ARCHITECTURES=gfx950"
          - backend: amd-sparse
            architectures: "gfx950"
            cmake_backend_flag: "-DESSENTIALS_AMD_BACKEND=ON -DESSENTIALS_NVIDIA_BACKEND=OFF -DESSENTIALS_FETCH_ROCM_LIBS=ON"
            cmake_arch_flag: "-DCMAKE_HIP_ARCHITECTURES=gfx950"
        
    # https://github.blog/changelog/2021-02-08-github-actions-skip-pull-request-and-push-workflows-with-skip-ci/
    if: "!contains(github.event.commits[0].message, '[skip ubuntu]')"
    runs-on: ${{matrix.os}}
    name: Build (${{matrix.backend}})

    steps:
      # - name: Free up space
      #   run: |
      #     sudo rm -rf /usr/share/dotnet
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf "/usr/local/share/boost"
      #     sudo rm -rf "$AGENT_TOOLSDIRECTORY"
  
      # Fetch CUDA toolkit for NVIDIA backend
      - name: Install CUDA toolkit via apt
        if: matrix.backend == 'nvidia'
        run: |
          curl --fail --location --silent --show-error \
            --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo "d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  cuda-keyring.deb" \
            | sha256sum --check -
          sudo dpkg --install cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install --yes cuda-toolkit-13-4=13.4.3-1

          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-13.4" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-13.4/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          /usr/local/cuda-13.4/bin/nvcc --version

      - name: Check nvcc version
        if: matrix.backend == 'nvidia'
        run: nvcc -V

      - name: Install ROCm Core SDK
        if: matrix.backend == 'amd' || matrix.backend == 'amd-sparse'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          curl --fail --location --silent --show-error \
            --output packages.gpg \
            https://stable.repo.amd.com/rocm/gpg/packages.gpg
          echo "090a4bf906822c5eb450ae8024b728b9281f2fccb0304641eb75018e4ec6a6dd  packages.gpg" \
            | sha256sum --check -
          sudo install --directory --mode 0755 /etc/apt/keyrings
          gpg --dearmor --batch --yes --output amdrocm.gpg packages.gpg
          sudo install --mode 0644 amdrocm.gpg /etc/apt/keyrings/amdrocm.gpg
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2404/' \
            'Suites: stable' \
            'Components: main' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/amdrocm.gpg' \
            | sudo tee /etc/apt/sources.list.d/amdrocm-stable.sources
          sudo apt-get update

          packages=(
            amdrocm-runtime-dev10.1=10.1.0-3
            amdrocm-rand-dev10.1=10.1.0-3
            amdrocm-rand10.1-gfx950=10.1.0-3
            amdrocm-sparse-dev10.1=10.1.0-3
            amdrocm-sparse10.1-gfx950=10.1.0-3
          )
          if [ "$BACKEND" = "amd" ]; then
            packages+=(amdrocm-ccl-dev10.1=10.1.0-3)
          fi
          sudo apt-get install --yes "${packages[@]}"

          echo "/opt/rocm/core-10.1/bin" >> "$GITHUB_PATH"
          echo "ROCM_PATH=/opt/rocm/core-10.1" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rocm/core-10.1/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Check hipcc version
        if: matrix.backend == 'amd' || matrix.backend == 'amd-sparse'
        run: hipcc --version
        
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        
      - name: Configure cmake
        if: matrix.backend == 'amd' || matrix.backend == 'amd-sparse'
        env:
          LD_LIBRARY_PATH: /opt/rocm/core-10.1/lib
        run: |
          cmake -B ${{github.workspace}}/build \
            -DESSENTIALS_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DROCM_PATH="${ROCM_PATH}" \
            ${{matrix.cmake_backend_flag}} \
            ${{matrix.cmake_arch_flag}}
            
      - name: Configure cmake
        if: matrix.backend == 'nvidia'
        run: |
          cmake -B ${{github.workspace}}/build \
            -DESSENTIALS_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            ${{matrix.cmake_backend_flag}} \
            ${{matrix.cmake_arch_flag}}
        
      - name: Build all applications
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
